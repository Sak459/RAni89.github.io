<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakuen Anime</title>

<style>
:root{
  --bg:#000;
  --accent:#ff3c78;
  --card:#1a1a1a;
  --text:#fff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:5px;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  user-select:none;
}

img{
  -webkit-user-drag:none;
  user-drag:none;
}

.header-fixed{
  width:100%;
  max-width:1000px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.banner-top{
  width:100%;
  height:205px;
  object-fit:cover;
  border-radius:8px 8px 8px 8px;
}

.poster{
  width:150px;
  border-radius:16px;
  margin-top:-70px;
  z-index:5;
  position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.anime-info{
  width:95%;
  max-width:1000px;
  text-align:center;
  margin-top:10px;
}

#animeTitle{
  font-size:1.6rem;
  margin:8px 0;
}

.meta{
  color:#bbb;
  font-size:.9rem;
  margin-bottom:12px;
}

.series-actions{
  display:flex;
  gap:24px;
  margin:16px 0;
}

.action-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:95px;
  padding:10px;
  border-radius:14px;
  background:#111;
  cursor:pointer;
  font-size:.8rem;
  color:#bbb;
  transition:.2s;
}

.action-btn.active{
  background:var(--accent);
  color:#fff;
}

#episodeTitle{
  font-size:1rem;
  margin-bottom:10px;
}

.scroll-episodes{
  width:100%;
  max-width:1000px;
  flex-grow:1;
  overflow-y:auto;
  padding:8px;
  padding-bottom:20px;
}

.episode-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.episode{
  background:var(--card);
  border-radius:14px;
  min-height:50px;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  position:relative;
  overflow:hidden;
}

.episode::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
}

.episode span{
  position:relative;
  z-index:2;
  padding:10px;
  text-align:center;
}

.episode.active,
.episode.last-watched{
  outline:2px solid var(--accent);
}

/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.4s;
}

.modal-overlay.active{
  opacity:1;
  pointer-events:all;
}

.modal{
  background:#1f1f1f;
  border-radius:16px;
  padding:35px 30px;
  max-width:400px;
  width:90%;
  text-align:center;
}

.modal h2{
  margin:0;
  color:#ff4d4d;
}

.modal p{
  color:#ccc;
}

.modal ul{
  text-align:left;
  color:#999;
}

.modal button{
  margin-top:20px;
  padding:12px 24px;
  background:#ff4d4d;
  border:none;
  border-radius:8px;
  color:#fff;
  opacity:.7;
}

/* Toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#28a745;
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  font-size:16px;
  opacity:0;
  transition:.4s;
  z-index:10000;
}

.toast.show{
  opacity:1;
}

/* Loading Screen */

#loadingScreen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999999;
  transition:opacity .4s ease;
}

#loadingScreen.hide{
  opacity:0;
  pointer-events:none;
}

.spinner{
  width:70px;
  height:70px;
  border:4px solid rgba(255,255,255,.15);
  border-top:4px solid var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loading-text{
  margin-top:15px;
  color:#fff;
  font-size:1.5rem;
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Cargando...</div>
</div>

<div class="header-fixed">

  <img class="banner-top" src="" id="banner">

  <img class="poster" id="poster">

  <div class="anime-info">

    <h1 id="animeTitle">Cargando...</h1>

    <div class="meta" id="animeMeta"></div>

  </div>

  <div class="series-actions">
    <div class="action-btn" id="favoriteBtn">❤️ Favoritos</div>
    <div class="action-btn" id="watchedBtn">✔ Finalizada</div>
  </div>

  <div id="episodeTitle">Selecciona un episodio</div>

</div>

<div class="scroll-episodes">
  <section class="episode-list" id="episodeList"></section>
</div>

<!-- Modal -->
<div class="modal-overlay" id="connectionModal">
  <div class="modal">
    <h2>Sin conexión</h2>
    <p>No se detecta acceso a Internet.</p>

    <ul>
      <li>Verifica tu Wi-Fi o datos móviles</li>
      <li>Conéctate a una red disponible</li>
      <li>Espera mientras se reconecta</li>
    </ul>

    <button disabled>Reconectando...</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  ✅ ¡Conexión restaurada!
</div>

<script>

/* ================= TMDB ================= */

const TMDB_API = "b6083b855479a79fd9acdb0a2789f126";

/* Anime */
const tmdbType = "tv";
const tmdbId = 210879;
/* Título personalizado */
const customTitle = "Rurouni Kenshin: Meiji Kenkaku Romantan - Kyoto Douran";

const customPoster = "https://image.tmdb.org/t/p/w500/c8fuok6u7EVg6yDcyATp8v7ixSF.jpg";

/* Temporada */
const seasonNumber = 1;

/* Episodios que quieres mostrar */
const firstEpisode = 25;
const lastEpisode = 47;

/* ID local */
const seriesId = "Anime055";

/* Tus links de video */
const videoLinks = [
  'https://player.zilla-networks.com/m3u8/9cc4dcfaee5c2bc9dbc7700e3fd13f99',
  'https://player.zilla-networks.com/m3u8/0e0bafa97d41dd06606e1f702a7fc6a8',
  'https://player.zilla-networks.com/m3u8/2e09f4d62736901c305cd5dcc33b502c',
  'https://player.zilla-networks.com/m3u8/8e9ecfa78314848d9af2e9869ff06874',
  'https://player.zilla-networks.com/m3u8/0ed9ff0e00ec413c1f82c56f9e70a019',
  'https://player.zilla-networks.com/m3u8/9688f5e5dfe5061c3d156e712635653f',
  'https://player.zilla-networks.com/m3u8/1b612a5a79a2a10b1f4bdde6fbd2db04',
  'https://player.zilla-networks.com/m3u8/2310c1b827b7deeec6771c1ad665e1a4',
  'https://player.zilla-networks.com/m3u8/aa8cfe8973be0f023b773c8803746deb',
  'https://player.zilla-networks.com/m3u8/593d66f82c612284f91e9eb0aca2adf5',
  'https://player.zilla-networks.com/m3u8/bf1866cf717c2f46d7cda220947388ad',
  'https://player.zilla-networks.com/m3u8/fb5228b69876ec48f2d15a8d16ee5f68',
  'https://player.zilla-networks.com/m3u8/b1996409499a6af4b028b9c7b806ad8c',
  'https://player.zilla-networks.com/m3u8/6228f2b8c9187b3fe9df4f2a1b92e424',
  'https://player.zilla-networks.com/m3u8/4b97948db7912801eb23af67a54c0b0b',
  'https://player.zilla-networks.com/m3u8/75e441438da06218af4e05a0fa1d2c89',
  'https://player.zilla-networks.com/m3u8/7db45cb5f9c5473577986b682db1ba0c',
  'https://player.zilla-networks.com/m3u8/acbef9bb8277139b31f6022cc883e30e',
  'https://player.zilla-networks.com/m3u8/fde6264b5843f8718f220b97c00e2abb',
  'https://player.zilla-networks.com/m3u8/46b9d4bf4275501c082aeb1d5461ad21',
  'https://player.zilla-networks.com/m3u8/5ccefbda3b0ed74e952313c126ff2bdc',
  'https://player.zilla-networks.com/m3u8/9d6d888e595afe7ff1b8081b6027579b',
  'https://player.zilla-networks.com/m3u8/bf965b43b87aa3f1192cb5c0e9b56368',
  'https://player.zilla-networks.com/m3u8/f4283060149800d66af1c345298da429',
  'https://player.zilla-networks.com/m3u8/fec69517ba79c14518fbb7f5deefd49d',
  'https://player.zilla-networks.com/m3u8/c709deea5179773d1bba6da52170fd3e',
  'https://player.zilla-networks.com/m3u8/eb8b821ebdbbd2d11479cd281e0e07b1',
  'https://player.zilla-networks.com/m3u8/0e2a93dd39b1d9da6350a296ee4bbb3c',
  'https://player.zilla-networks.com/m3u8/1d861cc3f5d32d44f1bb1b2450f19b82',
  'https://player.zilla-networks.com/m3u8/ebda6d7397c1b45ff8544d1bfb6882d8',
  'https://player.zilla-networks.com/m3u8/9ca2c95babbd1e36ffda8baebea54e9b',
  'https://player.zilla-networks.com/m3u8/b433db1eedb6b73d89ebc5593f0e276d',
  'https://player.zilla-networks.com/m3u8/98e14db19f7b0c95bc191489fffa0c58',
  'https://player.zilla-networks.com/m3u8/4d9b76e2f542f75d34c815ab2c384b40',
  'https://player.zilla-networks.com/m3u8/bf570383a929e0e2d0639313953a1b97',
  'https://player.zilla-networks.com/m3u8/7e5d7d3f262ab7031952d680b8b0d75d',
  'https://player.zilla-networks.com/m3u8/7d19b436b06ffb6bbcdf633544fe5e4a',
  'https://player.zilla-networks.com/m3u8/4a3b072ae555b04a8971a616cb9b183e',
  'https://player.zilla-networks.com/m3u8/28a8361bc3050acae50f405f761d7a04',
  'https://player.zilla-networks.com/m3u8/3f56ccdbc2ade20e7373f6f44e37bd85',
  'https://player.zilla-networks.com/m3u8/14e9c07bce170b7b305cfdc02f8fa815',
  'https://player.zilla-networks.com/m3u8/62313f97876aa3c7c909c86998f85972',
  'https://player.zilla-networks.com/m3u8/1e1f90a1f6274733a4daa1c387bf2ab8',
  'https://player.zilla-networks.com/m3u8/0644e2ed27c6db1dd00f9b8c5c9960df',
  'https://player.zilla-networks.com/m3u8/26e56aa76496fd89e95f4a0d5f639c2e',
  'https://player.zilla-networks.com/m3u8/32f381da0ad16ca992d1c296e18728be',
  'https://player.zilla-networks.com/m3u8/d56b7e1fdb903540b415f661fc9ecc77'
];

/* ================= ELEMENTOS ================= */

const episodeList = document.getElementById('episodeList');
const episodeTitle = document.getElementById('episodeTitle');

const favBtn = document.getElementById('favoriteBtn');
const watchedBtn = document.getElementById('watchedBtn');
const currentPage = window.location.pathname;
  
  const loadingScreen =
  document.getElementById("loadingScreen");

function hideLoading(){

  if(!loadingScreen) return;

  loadingScreen.classList.add("hide");

  setTimeout(()=>{
    loadingScreen?.remove();
  },400);

}

let episodes = [];
let currentEpisode = localStorage.getItem(seriesId+'_lastEpisode');

currentEpisode = currentEpisode !== null
  ? parseInt(currentEpisode)
  : null;

/* ================= STORAGE ================= */

const getList = k =>
  JSON.parse(localStorage.getItem(k)) || [];

const saveList = (k,v) =>
  localStorage.setItem(k, JSON.stringify(v));

/* ================= FAVORITOS ================= */

function isFavorite(){
  return getList('favorites').some(s => s.id === seriesId);
}

function toggleFavorite(){

  let favs = getList('favorites');

  if(isFavorite()){

    favs = favs.filter(s => s.id !== seriesId);

    favBtn.classList.remove('active');

  }else{

    favs.push({
     id: seriesId,
     title:         document.getElementById("animeTitle").textContent,
     banner: document.getElementById("poster").src,
     page: currentPage
    });

    favBtn.classList.add('active');

  }

  saveList('favorites', favs);

}

/* ================= FINALIZADA ================= */

function toggleWatched(){

  let list = getList('watched');

  if(list.includes(seriesId)){

    list = list.filter(id => id !== seriesId);

    watchedBtn.classList.remove('active');

  }else{

    list.push(seriesId);

    watchedBtn.classList.add('active');

  }

  saveList('watched', list);

}

/* ================= CARGAR ANIME ================= */

async function loadAnime(){

  try{

    /* Obtener datos */

    const detailsReq = await fetch(
      `https://api.themoviedb.org/3/${tmdbType}/${tmdbId}?api_key=${TMDB_API}&language=es-ES`
    );

    const data = await detailsReq.json();

    /* Banner */
    document.getElementById("banner").src =
      `https://image.tmdb.org/t/p/original${data.backdrop_path}`;

    /* Poster */
    document.getElementById("poster").src =
  customPoster || `https://image.tmdb.org/t/p/w500${data.poster_path}`;

    /* Título personalizado */
document.getElementById("animeTitle").textContent =
  customTitle || data.name || data.title;

    /* Géneros */
    const genres = data.genres
  .map(g => g.name)
  .join(", ");

    /* ================= SERIES ================= */

    if(tmdbType === "tv"){

      const seasonReq = await fetch(
        `https://api.themoviedb.org/3/tv/${tmdbId}/season/${seasonNumber}?api_key=${TMDB_API}&language=es-ES`
      );

      const seasonData = await seasonReq.json();
      
      const displayedEpisodes =
  Math.min(
    seasonData.episodes.length,
    lastEpisode
  ) - firstEpisode + 1;

const seasonYear =
  seasonData.air_date
    ? seasonData.air_date.split("-")[0]
    : "";

document.getElementById("animeMeta").innerHTML =
`
⭐ ${data.vote_average.toFixed(1)}
• ${seasonYear}
• ${genres}
• ${displayedEpisodes} Episodios
`;

      const episodiosDisponibles = seasonData.episodes
  .slice(firstEpisode - 1, lastEpisode)
  .map((ep, index) => ({
    ...ep,
    video: videoLinks[index]
  }))
  .filter(ep =>
    ep.video &&
    ep.air_date &&
    new Date(ep.air_date) <= new Date()
  );

episodes = episodiosDisponibles.map((ep, index) => ({

  title: `Episodio ${index + 1}`,

  url: ep.video,

  thumbnail: ep.still_path
    ? `https://image.tmdb.org/t/p/w500${ep.still_path}`
    : `https://image.tmdb.org/t/p/original${data.backdrop_path}`

}));

    }

    /* ================= PELÍCULAS ================= */

    else{

      episodes = [{

        title: data.title,

        url: videoLinks[0] || '',

        thumbnail:
          `https://image.tmdb.org/t/p/original${data.backdrop_path}`

      }];

    }

    renderEpisodes();
    
    hideLoading();

  }catch(err){

    console.log(err);
    
    hideLoading();

    showToast("❌ Error cargando TMDb", "#ff4444");

  }

}

/* ================= RENDER ================= */

function renderEpisodes(){

  episodeList.innerHTML = '';

  episodes.forEach((ep,i)=>{

    const div = document.createElement('div');

    div.className='episode';

    div.style.backgroundImage=`url(${ep.thumbnail})`;

    div.innerHTML=`<span>${ep.title}</span>`;

    div.onclick=()=>loadEpisode(i);

    episodeList.appendChild(div);

  });

  updateUI();
  
  /* Scroll automático al último episodio visto */

  if(currentEpisode !== null && episodes[currentEpisode]){

    episodeTitle.textContent =
      episodes[currentEpisode].title;

    setTimeout(()=>{

      document.querySelectorAll('.episode')[currentEpisode]
        ?.scrollIntoView({
          behavior:'smooth',
          block:'center'
        });

    },1500);

  }

}

/* ================= REPRODUCIR ================= */

function loadEpisode(i){

  currentEpisode = i;

  episodeTitle.textContent = episodes[i].title;

  const url = episodes[i].url;

  if(url){

    Android.openEpisode(url);

  }else{

    showToast("❌ Episodio no disponible", "#ff4444");

  }

  localStorage.setItem(seriesId+'_lastEpisode', i);

  updateUI();

}

/* ================= UI ================= */

function updateUI(){

  document.querySelectorAll('.episode')
    .forEach((e,idx)=>{

      e.classList.toggle(
        'active',
        idx===currentEpisode
      );

      e.classList.toggle(
        'last-watched',
        idx===currentEpisode
      );

    });

}

/* ================= INIT ================= */

if(isFavorite())
  favBtn.classList.add('active');

if(getList('watched').includes(seriesId))
  watchedBtn.classList.add('active');

favBtn.onclick = toggleFavorite;

watchedBtn.onclick = toggleWatched;

loadAnime();

/* ================= CONEXIÓN ================= */

const modal = document.getElementById("connectionModal");

let wasOffline = false;

function updateConnectionStatus(){

  if(!navigator.onLine){

    modal.classList.add("active");

    wasOffline = true;

  }else{

    modal.classList.remove("active");

    if(wasOffline){

      showToast("✅ ¡Conexión restaurada!");

      wasOffline = false;

    }

  }

}

window.addEventListener(
  "load",
  updateConnectionStatus
);

window.addEventListener(
  "offline",
  updateConnectionStatus
);

window.addEventListener(
  "online",
  updateConnectionStatus
);

/* ================= TOAST ================= */

function showToast(message, color="#28a745"){

  const toast = document.getElementById("toast");

  toast.style.background = color;

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },3500);

}

/* ================= BLOQUEOS ================= */

document.addEventListener(
  "dragstart",
  e => e.preventDefault()
);

document.addEventListener(
  "selectstart",
  e => e.preventDefault()
);

</script>

</body>
</html>
